# Publish the sdist and wheel to PyPI. Manual trigger only, on purpose: this
# project has never published a release there, and a tag- or release-
# triggered publish would attempt its very first upload the first time this
# file merged, without anyone having deliberately chosen that moment.
# Publishing stays a deliberate, human-triggered action from the Actions tab
# — this file does not decide when that happens, it only makes the action
# available once it is chosen.
#
# **Dispatch it from a `vX.Y.Z` tag, not from a branch.** The `verify-tag`
# job below resolves the tag from the ref this workflow was dispatched on,
# and refuses to go further when there is not one. That is the hole this job
# closes: until 2026-09-06 the only thing this file checked was that a human
# had typed the word "publish" into a box, and it would then build whatever
# the dispatched ref happened to hold and upload it to the public index
# under this project's name. Typing "publish" says a person meant to
# publish. It does not say what.
#
# What `verify-tag` requires: an annotated tag object, whose SSH signature
# verifies against `.github/allowed_signers` — a public key committed in
# this repository, read at the ref being verified, so trusting it is the
# same trust decision as running this workflow's own code — and which names
# the commit this run is building.
#
# Grandfathered: `v0.2.0`. It is annotated but was cut with `git tag -a`
# rather than `-s`, which the README's Release & Versioning row has recorded
# as a gap since it was tagged, and rewriting a published tag is worse than
# the gap it would close. `v0.1.0` is signed and verifies today, so it is
# not on the list. The list may hold only literal `vX.Y.Z` names; widening
# it to a pattern fails the gate rather than exempting the future.
#
# **Before the first run**, PyPI's Trusted Publishing needs to be configured
# for this exact repository, workflow filename, and the `pypi` environment
# below: pypi.org -> your account -> Publishing -> "Add a new pending
# publisher". That step needs a human logged into a PyPI account; nothing in
# this repository or this file can do it. Until it is done, running this
# workflow builds the distribution successfully and then fails at the
# publish step with an authentication error — an honest red, not a silent
# no-op, the same posture `release.yml` takes about itself before its first
# real tag.
#
# No stored secret either way: OIDC exchanges GitHub's own short-lived
# token for a PyPI upload credential at publish time, the same keyless
# pattern `release.yml` already uses for Sigstore cosign. The same OIDC
# token also attests SLSA build provenance for the files being uploaded, so
# a consumer can ask GitHub which run produced a wheel rather than asking
# PyPI: `gh attestation verify plumbline_eval-*.whl --owner ChelseaKR`.
#
# The distribution name is `plumbline-eval` (see pyproject.toml's own
# comment on `name` for why `plumbline` itself was not available) — confirm
# that is still the intended name before the first real run, since claiming
# a name on PyPI is not something a later workflow run can undo.

name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm — this uploads to the real, public PyPI index.'
        required: true

permissions:
  contents: read

jobs:
  verify-tag:
    name: the tag is one the maintainer signed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Refuse an unconfirmed run
        env:
          # An intermediate env var, not `${{ github.event.inputs.confirm }}`
          # interpolated straight into the script: `github` context data is
          # untrusted input as far as a `run:` step is concerned, and
          # interpolating it directly is a shell-injection primitive
          # (semgrep's yaml.github-actions.security.run-shell-injection
          # rule, caught scanning this repository's own workflows).
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish" ]; then
            echo "::error::the 'confirm' input must be exactly 'publish'; got '$CONFIRM'" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the tag object being verified has to be
          # present locally for `git verify-tag` to read its signature.
          fetch-depth: 0
          persist-credentials: false

      - name: The dispatched ref is a signed release tag
        id: verify
        env:
          # Routed through `env:` for the same reason the confirm check is.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECT_COMMIT: ${{ github.sha }}
          ALLOWED_SIGNERS: .github/allowed_signers
          # v0.2.0 was cut with `git tag -a`, not `-s`; see this file's header.
          GRANDFATHERED_TAGS: "v0.2.0"
        run: bash .github/verify-release-tag.sh

  build:
    name: build the distribution
    needs: [verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the verified tag names, not the ref the dispatch
          # carried. Otherwise the signature check proves that some tag was
          # signed while this job builds something else.
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --quiet build
          python3 -m build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Named so the Trusted Publisher registered on PyPI can be scoped to
    # this environment specifically, not to every job in this repository.
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC for PyPI Trusted Publishing; no stored secret
      attestations: write # SLSA build provenance for the files uploaded below
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist

      # Attested here rather than in `build` so the subject is the file this
      # job is about to upload, after the artifact round trip, rather than a
      # file that was equal to it before one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
