# Supply-chain and source scanning.
#
# This repository has no third-party runtime dependencies, which removes the
# largest class of supply-chain risk and removes none of the rest: the
# workflows themselves are executable, the standard library has sharp edges,
# and a secret committed here would be just as exposed as anywhere.
#
# Both jobs run on push and pull_request, not only on a schedule and not on
# `workflow_dispatch` alone. A scanner that only runs when someone remembers to
# press a button is the same thing as no scanner, dressed up as one.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 0" # weekly, Sunday, so history is swept even in a quiet week

permissions:
  contents: read

# CI-CD-STANDARD.md 11c: cancel superseded runs on the same ref -- but two commits pushed to
# `main` share one ref and are not supersessions of each other. Keyed on the ref alone, the
# second push cancelled the run checking the first, and a cancelled run is not a failure:
# nothing goes red and the commit sits on `main` with no verdict at all. The SHA separates
# them; a pull request keeps one group per PR, so a force-push still cancels its predecessor.
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  # Taint-style SAST over the source and over the workflow files. Runs
  # unauthenticated against the public registry ruleset; no token is required
  # or used.
  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e # 1.168.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep ci --config auto

  # Full-history secret scan, in two lanes, over the whole commit history.
  #
  # LANE 1 reports every tier TruffleHog has: verified, unknown AND unverified.
  # `unverified` means TruffleHog asked the provider and the provider said no --
  # which is what a REVOKED credential looks like, and revocation is the normal
  # end state of a real leak. A history sweep exists precisely to find a secret
  # that was committed and later taken back out, so a tier selection omitting
  # `unverified` cannot fail on the case it was written for. This job ran
  # `--only-verified` until 2026-09-06 and was in exactly that state.
  #
  # LANE 2 is the gate as it stood before, unchanged: verified results only,
  # every detector but Lob. It exists so that lane 1's extra URI exclusion buys
  # no loss of coverage -- the two lanes together are a strict superset of what
  # this job checked before. It runs under `if: ${{ !cancelled() }}` so a
  # failure in lane 1 does not hide lane 2's verdict.
  #
  # The `gitleaks` job below is a third engine on the same history, matching on
  # pattern rather than verification. It stays: it catches shapes TruffleHog has
  # no detector for, and it is the one that found the planted key first.
  #
  # The job NAME is load-bearing and is deliberately left alone -- it now
  # UNDERSTATES what the job does, and that is the lesser of two evils. Branch
  # protection on `main` lists "full-history secret scan (verified only)" as a
  # required status check, so renaming it would retire the context the
  # protection requires and leave every future pull request waiting on a check
  # that can never report. `enforce_admins` is true here, so there is no
  # break-glass path either. Checked on 2026-09-06 against
  # `repos/ChelseaKR/plumbline/branches/main/protection`. Renaming this job
  # means editing that settings page in the same change; until then the name
  # stays wrong on purpose and README's CI/CD row records why.
  secrets:
    name: full-history secret scan (verified only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # whole history, not a diff
          persist-credentials: false
      # LANE 1 -- every result tier, with the two fixture-matching detectors off.
      - name: TruffleHog (full history, all result tiers)
        uses: trufflesecurity/trufflehog@cc1fe982afc515d2991365ce8d4d0dd07170fcad # v3.97.2
        with:
          path: ./
          # Pinned, and it must equal the version comment on the pinned ref
          # above. The action's `version:` input defaults to "latest" and it
          # runs `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so the SHA
          # pin above pins only the wrapper, not the binary that scans. Without
          # this input the sweep silently tracked whatever upstream published
          # last, and every Dependabot bump of the ref was a no-op because
          # Dependabot never edits a `with:` input.
          version: "3.97.2"
          # The action's baked-in command already passes --fail; repeating it
          # is a CLI error.
          #
          # `--results=verified,unknown,unverified` is load-bearing. Measured
          # 2026-09-06 on a throwaway clone of this repository with a
          # real-shaped AWS key planted in one commit and deleted in the next,
          # confirmed present in history and absent at HEAD before the result
          # was trusted (a key that is a vendor's DOCUMENTED EXAMPLE is filtered
          # under every tier and would have no-opped the whole test):
          #
          #   --only-verified                        exit 0,   0 reported
          #   --results=verified                     exit 0,   0 reported
          #   --results=verified,unknown             exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # Lob is excluded because its detector matches pytest-style function
          # names: a Lob key is `test_` or `live_` followed by alphanumerics,
          # which is also the shape of most names under tests/, and its
          # verifier confirms them because a malformed key and an unauthorized
          # key are indistinguishable in its response. There is no Lob
          # integration here and no dependency that could introduce one.
          #
          # URI is excluded from THIS LANE ONLY. Re-scanning the real history
          # under the widened tier reported exactly two findings, both the same
          # synthetic DSN on two lines of tests/test_network.py:
          # `https://user:secret@example.test/chat`, the argument to
          # `test_credentials_in_the_url_are_refused`, whose entire point is
          # that credentials in a URL are rejected. `example.test` is a reserved
          # TLD and cannot resolve. Nothing else fired. Lane 2 below keeps URI
          # armed for verified results, so a real DSN is still caught.
          #
          # Neither exclusion is a path exclusion, on purpose: excluding tests/
          # would blind the scan to real secrets in fixtures, which is where
          # they most often hide. If another placeholder ever fires, exclude
          # that DETECTOR by name and never narrow the tier back.
          extra_args: --results=verified,unknown,unverified --exclude-detectors=Lob,URI

      # LANE 2 -- the gate exactly as it stood before lane 1 was added: verified
      # results only, every detector but Lob, over every path. `--results=verified`
      # and the `--only-verified` it replaces are the same selection; the flag is
      # spelled this way so that no lane of this job can be read as the setting
      # that could not fail. `!cancelled()` so lane 1 failing does not hide this
      # verdict, while a cancelled run still stops both.
      - name: TruffleHog (full history, verified results, URI still armed)
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@cc1fe982afc515d2991365ce8d4d0dd07170fcad # v3.97.2
        with:
          path: ./
          version: "3.97.2"
          extra_args: --results=verified --exclude-detectors=Lob

  # A second engine on the same history, matching on pattern rather than on
  # verification.
  #
  # Measured on 2026-09-06 against a throwaway clone of this repository with a
  # real-shaped AWS key planted in one commit and deleted in the next (present
  # in history, absent at HEAD, both confirmed before trusting the result):
  #
  #   trufflehog --only-verified                       exit 0,   nothing reported
  #   trufflehog --results=verified,unknown,unverified exit 183, 1 unverified
  #   gitleaks git .                                   exit 1,   2 leaks found
  #
  # This job was added first, when the TruffleHog job above still ran
  # `--only-verified`. The argument then was that widening the tier would report
  # two synthetic fixtures in `tests/test_network.py` and go red for no real
  # finding, so gitleaks was added beside it instead. Half of that was right:
  # the two fixtures are real and are the whole of what the widened tier reports
  # here. The conclusion was not -- the answer to a noisy DETECTOR is to exclude
  # that detector by name in one lane and keep it armed in another, which is
  # what the job above now does, and not to leave the tier narrowed. Both are
  # kept. gitleaks catches shapes TruffleHog has no detector for, and TruffleHog
  # verifies, which gitleaks cannot.
  gitleaks:
    name: full-history secret scan (gitleaks, any state)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # whole history, not a diff
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        # A checksum-verified, version-pinned binary rather than a third-party
        # action: a deterministic supply-chain pin. `gitleaks git` with a
        # full-depth checkout walks the entire history.
        shell: bash
        run: |
          # pipefail so the checksum pipeline below cannot pass on a grep that
          # matched nothing. The default shell is `bash -e`, which does not set it.
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1
