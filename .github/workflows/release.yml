# Release: SBOM verification and a keyless-signed release artifact.
#
# Closes two "Not met" cells the README's Standards Conformance table names
# against itself: "no SBOM, ..., no signed release" (Security & Supply-Chain)
# and "no release workflow, no signed tag, no published artifact" (Release &
# Versioning). This repository already has the best possible starting
# position for it — zero third-party runtime dependencies — so this is
# wiring, not redesign.
#
# OpenSSF Scorecard used to be a job in this file and is not anymore: pushing
# the first real v0.2.0 tag exercised it for the first time and it failed —
# `ossf/scorecard-action` refuses to analyze anything but the repository's
# default branch, and a `push: tags:` trigger is never that. See
# `scorecard.yml`, which triggers the way the action's own upstream template
# does (push to `main`, plus a weekly schedule) — never on a tag.
#
# The sbom/sign/release chain below **has now been exercised**: v0.2.0 is
# the first tag it ran against, on GitHub's own infrastructure, producing a
# real signed SBOM and a real published Release — see the Standards
# Conformance table for what that does and does not close. It first failed
# on that same tag with a different, mechanical defect: `actions/upload-
# artifact`'s pin was a 39-character string, one hex digit short of a real
# SHA-1, so it could not resolve. Fixed and re-verified against the GitHub
# API before the tag was moved and re-pushed. Every remaining action pin
# below was cross-checked the same way.
#
# Keyless signing (Sigstore/cosign, via GitHub's own OIDC token) rather than
# a stored private key: consistent with never committing a secret to this
# repository, and it is what `id-token: write` on the `sign` job is for.
#
# `verify-tag`, added 2026-09-06, is what stands between a tag and a
# published Release. Before it, pushing any `v*` tag published a GitHub
# Release under this repository's name; the README's own Release &
# Versioning row recorded that the tag "is annotated, not cryptographically
# signed", and nothing read a signature even when one was there. It now
# requires an annotated tag object whose SSH signature verifies against
# `.github/allowed_signers` — a public key committed here, read at the ref
# being verified — and which names the commit the run is building.
#
# It runs only on a tag, which is the same condition `release` already
# carries. A `workflow_dispatch` from a branch still exercises the
# sbom/sign chain, as this file's trigger has always allowed, and still
# publishes nothing: with `verify-tag` skipped, `release` is skipped too.
# There is no path where a Release is created and `verify-tag` did not pass.
#
# Grandfathered: `v0.2.0`, which was cut with `git tag -a` rather than `-s`.
# Rewriting a published tag is worse than the gap it would close. `v0.1.0`
# is signed and verifies against the committed key today, so it is not on
# the list. The list may hold only literal `vX.Y.Z` names; widening it to a
# pattern fails the gate rather than exempting the future.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # exercise the pipeline without waiting for a real tag

permissions:
  contents: read

jobs:
  verify-tag:
    name: the release tag is one the maintainer signed
    # Only a tag can be verified, and only a tag can publish. A branch
    # dispatch skips this and, through `needs`, skips the release too.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the tag object being verified has to be
          # present locally for `git verify-tag` to read its signature.
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is signed by a key this repository trusts
        id: verify
        env:
          # Routed through `env:` rather than interpolated into the script,
          # for the reason publish-pypi.yml's confirm check spells out.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECT_COMMIT: ${{ github.sha }}
          ALLOWED_SIGNERS: .github/allowed_signers
          # v0.2.0 was cut with `git tag -a`, not `-s`; see this file's header.
          GRANDFATHERED_TAGS: "v0.2.0"
        run: bash .github/verify-release-tag.sh

  sbom:
    name: verify and publish the SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Fails if the committed SBOM is not what pyproject.toml produces —
      # the same "committed artifact must be current" discipline as the
      # published evidence page. A release built from a stale SBOM would be
      # a supply-chain claim this repository could not back.
      - name: sbom.cdx.json must be what pyproject.toml produces
        run: python3 tools/build_sbom.py --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  sign:
    name: keyless-sign the SBOM
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Sigstore's keyless flow: GitHub mints a short-lived OIDC token this
      # job exchanges for a Fulcio certificate. No private key is generated,
      # stored, or rotated by this repository.
      id-token: write
      # The same token underwrites the SLSA build-provenance attestation
      # below. Cosign proves this workflow signed the file; the attestation
      # records which run produced it, and `gh attestation verify
      # sbom.cdx.json --owner ChelseaKR` reads it back without cosign.
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the SBOM (keyless)
        run: cosign sign-blob --yes --bundle sbom.cdx.json.sigstore.json sbom.cdx.json

      - name: Attest build provenance for the SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-signature
          path: |
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
          if-no-files-found: error

  release:
    name: publish the GitHub Release
    needs: [verify-tag, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to create the release and attach files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-signature

      # The built-in `gh` CLI, not a third-party action: one fewer pin to
      # maintain for something the runner already ships, and this project
      # avoids adding a dependency where an existing tool already does the
      # job — the same instinct that keeps the runtime standard-library-only.
      #
      # The tag comes from `verify-tag` rather than from `GITHUB_REF_NAME`,
      # so the Release is cut against the tag that was actually verified and
      # not against a ref this job re-derives for itself.
      - name: Create the release and attach the signed SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            sbom.cdx.json sbom.cdx.json.sigstore.json
