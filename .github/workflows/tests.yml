# The repository's own gate. It runs on every push to main and every pull
# request, and it is the same suite a contributor runs locally:
#
#   PYTHONPATH=src:tests python3 -m unittest discover -s tests
#
# Nothing here needs a key, a network, or a third-party package: the tests
# bind a local HTTP server on the loopback interface for the adapter and
# model-judge paths, and everything else is standard library.
#
# Every step below has to be able to fail. A step that cannot go red is a
# badge, and this repository exists to argue against those.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # No uv here on purpose: this job's property is that the suite, the
      # reproduction and the drill all pass on a bare interpreter with nothing
      # installed. `make` is not a Python package, and the targets these steps
      # call use plain `python3` for exactly that reason.
      - name: Run the suite
        run: make test-bare

      # The audit of the bundled demo is committed. If a change to the harness
      # moves a score, a hash, or a byte of the report, this fails — which is
      # the reproducibility claim, enforced. It also re-checks the committed
      # report against its own seal.
      #
      # `make reproduce` and not inline script: a step that exists only in this
      # file is a step `make verify` cannot run, and a contributor whose gate
      # is green on a tree this workflow rejects has been told the wrong thing.
      # tests/test_ci_parity.py fails if any step here stops being a make
      # target. The target writes to a temporary directory and compares with
      # `diff -r`, which catches a changed byte, a report no longer written,
      # and an uncommitted directory a moved run id would create.
      - name: The committed demo audit must still reproduce byte for byte
        run: make reproduce

      # The tamper drill, as documented in the README. Exit codes are captured
      # explicitly inside the target rather than leaned on through `&&`: a
      # drill that asserts only "did not exit 0" would be satisfied by the
      # harness crashing, which is the opposite of what it is trying to prove.
      # It runs against a copy, so nothing here has to `git checkout --` after.
      - name: Tamper drill — integrity refusal, then a caught fabrication
        run: make tamper-drill

  # The gates that need a tool rather than the interpreter: the linter and the
  # branch-coverage floor. They run once, on one version, because neither is
  # version-dependent and the matrix above is what proves the suite is.
  #
  # This is the same `make verify` a contributor runs. It is a separate job so
  # the matrix above keeps its own property intact: that the suite passes on a
  # bare interpreter with nothing installed.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # `--locked`, not `--frozen`: `--frozen` never reads pyproject.toml, so
      # it exits 0 on a lockfile that no longer matches the manifest.
      - name: Install the dev tooling
        run: uv sync --locked

      - name: make verify
        run: make verify
